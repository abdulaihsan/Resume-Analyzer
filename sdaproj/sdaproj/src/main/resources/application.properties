spring.application.name=sdaproj

## Database Connection
# Replace 'resume_db' with your actual database name if different
spring.datasource.url=jdbc:postgresql://localhost:5432/resume_db

# Your PostgreSQL username (default is usually 'postgres')
spring.datasource.username=postgres

# Your PostgreSQL password (CHANGE THIS to what you set during installation)
spring.datasource.password=abdullah

# The JDBC Driver
spring.datasource.driver-class-name=org.postgresql.Driver

## JPA / Hibernate Settings
# 'update' automatically creates/updates tables to match your Java Entities
# Use 'create' if you want to wipe the database clean every time you restart
spring.jpa.hibernate.ddl-auto=update

# Tells Hibernate to speak PostgreSQL SQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Debugging: Prints SQL queries to the console (Useful to see what's happening)
spring.jpa.show-sql=true